<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Sistema de Cotizaciones</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; }
        h1, h2 { color: #1a73e8; }
        nav a { margin-right: 15px; }
        form, .lista { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input, button { padding: 8px; margin-top: 5px; width: 100%; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button.secundario { background: #34a853; width: auto; padding: 5px 10px; }
        button.cancelar { background: #999; width: auto; padding: 5px 10px; }
        .cliente { border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Cotizaciones</a>
        <a href="clientes.html">Clientes</a>
    </nav>
    <h1>Gestión de clientes</h1>

    <h2 id="titulo-form">Crear cliente</h2>
    <form id="form-cliente">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" placeholder="Ej. 55 1234 5678">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Ej. cliente@empresa.com">

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" placeholder="Ej. Calle, número, ciudad">

        <button type="submit" id="btn-guardar">Guardar cliente</button>
        <button type="button" id="btn-cancelar" class="cancelar" style="display:none;">Cancelar edición</button>
    </form>
    <p id="mensaje"></p>

    <h2>Lista de clientes</h2>
    <div id="lista" class="lista"></div>

    <script src="clientes.js"></script>
</body>
</html>
